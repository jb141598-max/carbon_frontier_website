[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Backward compatibility for the old archived-update detail format.
# The browser canonicalizes /updates/archive/<slug> to /updates/<slug>.
[[redirects]]
  from = "/updates/archive/:slug"
  to = "/updates.html"
  status = 200

# Archive index.
[[redirects]]
  from = "/updates/archive"
  to = "/updates.html"
  status = 200

# Updates admin panel route. Keep this before /updates/:slug so it is
# treated as the admin surface instead of as an update permalink.
[[redirects]]
  from = "/updates/adminpanel"
  to = "/updates.html"
  status = 200

# Permanent update detail/current-home pages for both current and archived
# updates, for example: /updates/solar-panel-fix
[[redirects]]
  from = "/updates/:slug"
  to = "/updates.html"
  status = 200

# Backward compatibility for the previous one-segment permalink format.
# The browser canonicalizes these to /updates/<slug> after loading the update state.
[[redirects]]
  from = "/:slug"
  to = "/updates.html"
  status = 200

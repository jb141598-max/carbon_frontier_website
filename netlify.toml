[build.environment]
  # @netlify/database 2 requires Node 22.12 or newer. Netlify resolves "22"
  # to the newest available Node 22 release for builds and Functions.
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Native Carbon Frontier wiki. These routes must stay above the broad
# Updates permalink fallbacks below.
[[redirects]]
  from = "/wiki"
  to = "/wiki.html"
  status = 200

# Wiki permission management has its own page and URL. Keep these before the
# general wiki wildcard used for future article routes.
[[redirects]]
  from = "/wiki/permissions"
  to = "/wiki-permissions.html"
  status = 200

[[redirects]]
  from = "/wiki/permissions/"
  to = "/wiki-permissions.html"
  status = 200

# Contributor analytics is restricted to wiki owners and admins by the
# server Function, even if someone knows the page address.
[[redirects]]
  from = "/wiki/analytics"
  to = "/wiki-analytics.html"
  status = 200

[[redirects]]
  from = "/wiki/analytics/"
  to = "/wiki-analytics.html"
  status = 200

[[redirects]]
  from = "/wiki/admin/analytics"
  to = "/wiki-analytics.html"
  status = 200

[[redirects]]
  from = "/wiki/moderation"
  to = "/wiki-moderation.html"
  status = 200

[[redirects]]
  from = "/wiki/moderation/"
  to = "/wiki-moderation.html"
  status = 200

[[redirects]]
  from = "/wiki/admin/moderation"
  to = "/wiki-moderation.html"
  status = 200

# Owner/Admin Miraheze migration tool.
[[redirects]]
  from = "/wiki/import"
  to = "/wiki-import.html"
  status = 200

[[redirects]]
  from = "/wiki/import/"
  to = "/wiki-import.html"
  status = 200

[[redirects]]
  from = "/wiki/admin/import"
  to = "/wiki-import.html"
  status = 200

# Reusable template library and visual Google Drawings-style editor.
[[redirects]]
  from = "/wiki/templates"
  to = "/wiki-templates.html"
  status = 200

[[redirects]]
  from = "/wiki/templates/"
  to = "/wiki-templates.html"
  status = 200

[[redirects]]
  from = "/wiki/templates/*"
  to = "/wiki-templates.html"
  status = 200

# Shared image catalog. Editors select catalog images instead of uploading
# separate copies directly into individual pages or templates.
[[redirects]]
  from = "/wiki/images"
  to = "/wiki-media.html"
  status = 200

[[redirects]]
  from = "/wiki/images/"
  to = "/wiki-media.html"
  status = 200

[[redirects]]
  from = "/wiki/media"
  to = "/wiki-media.html"
  status = 200

[[redirects]]
  from = "/wiki/media/"
  to = "/wiki-media.html"
  status = 200

[[redirects]]
  from = "/wiki/*"
  to = "/wiki.html"
  status = 200

# Backward compatibility for the old archived-update detail format.
# The browser canonicalizes /updates/archive/<slug> to /updates/<slug>.
[[redirects]]
  from = "/updates/archive/:slug"
  to = "/updates.html"
  status = 200

# Archive index.
[[redirects]]
  from = "/updates/archive"
  to = "/updates.html"
  status = 200

# Updates admin panel route. Keep this before /updates/:slug so it is
# treated as the admin surface instead of as an update permalink.
[[redirects]]
  from = "/updates/adminpanel"
  to = "/updates.html"
  status = 200

# Permanent update detail/current-home pages for both current and archived
# updates, for example: /updates/solar-panel-fix
[[redirects]]
  from = "/updates/:slug"
  to = "/updates.html"
  status = 200

# Backward compatibility for the previous one-segment permalink format.
# The browser canonicalizes these to /updates/<slug> after loading the update state.
[[redirects]]
  from = "/:slug"
  to = "/updates.html"
  status = 200
